services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simaligano
    ports:
      - "8000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - API_URL:${API_URL}
      - NEXT_PUBLIC_API_URL:${NEXT_PUBLIC_API_URL}
      - AUTH_SECRET :${AUTH_SECRET}
